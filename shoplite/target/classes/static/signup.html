<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopLite - Signup</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            🛒
        </div>

        <h1>SHOPLITE</h1>

        <p class="subtitle">
            Small Shop Inventory & Billing System
        </p>


        <h2>Create Shop Account</h2>

        <p class="description">
            Create your Shop Owner account
        </p>


        <form id="signupForm">


            <div class="input-group">

                <label>Shop Owner Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required>

            </div>


            <div class="input-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required>

            </div>


            <button
                type="submit"
                class="auth-btn">

                Create Shop Account

            </button>

        </form>


        <div id="signupMessage"></div>


        <p class="switch-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>


<script src="auth.js"></script>

</body>
</html>
